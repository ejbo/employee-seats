# ─────────────────────────────────────────────────────────────────────────────
# 座位图（employee-seats）— nginx 子路径部署：https://cari.rnd.huawei.com/seats
# 改自 skills-community 的 ai-community 配置，去掉了媒体相关部分。
#
# 用法：把「PART A」放进 http{}（与其他 upstream 并列），把「PART B」放进
# cari.rnd.huawei.com 的 server{}，且必须在 catch-all `location /` 之前。
# 然后：sudo nginx -t && sudo kill -HUP <nginx master pid>
#（共享机器上不要 systemctl restart nginx —— 会把邻居应用一起打断）
#
# 三条踩过坑的规则：
#   1. proxy_pass 结尾「没有斜杠」：URI 要带着 /seats/ 原样交给 Next（basePath 需要它）。
#   2. 用 ^~ 前缀匹配，否则 server 里的静态资源正则会抢走 /seats/_next/static/*.js。
#   3. `location = /seats` 必须 proxy 而不是 301 到 /seats/，否则和 Next 的 308 互踢成死循环。
# ─────────────────────────────────────────────────────────────────────────────

# ── PART A：http{} ───────────────────────────────────────────────────────────
upstream employee_seats {
    server 127.0.0.1:3200;
    keepalive          32;
    keepalive_timeout  60s;
    keepalive_requests 1000;
}
map $http_upgrade $connection_upgrade_seats {
    default upgrade;
    ''      '';
}

# ── PART B：server{ server_name cari.rnd.huawei.com; … } ─────────────────────
# 静态资源直接由 nginx 发（构建产物；路径改成本机的仓库目录）
location ^~ /seats/_next/static/ {
    if ($host != "cari.rnd.huawei.com") {
        return 301 https://cari.rnd.huawei.com$request_uri;
    }
    alias /opt/cari_projects/employee-seats/.next/static/;
    sendfile    on;
    tcp_nopush  on;
    gzip_static on;
    access_log  off;
    add_header Cache-Control 'public, max-age=31536000, immutable' always;
}

location ^~ /seats/ {
    # 登录必须在 AUTH_URL 的主机名上发起，否则 state cookie 落在别的 cookie jar 里，
    # 回调时报 "InvalidCheck: state value could not be parsed"
    if ($host != "cari.rnd.huawei.com") {
        return 301 https://cari.rnd.huawei.com$request_uri;
    }
    proxy_pass         http://employee_seats;             # 无尾斜杠
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto https;           # 缺了它回调地址会变成 http://，IDaaS 报 E_10004
    proxy_set_header   Upgrade           $http_upgrade;
    proxy_set_header   Connection        $connection_upgrade_seats;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    client_max_body_size 32m;                             # 底图 / Excel 上传
    proxy_buffering    on;
    proxy_buffer_size  128k;
    proxy_buffers      16 64k;
    gzip off;
}

# 裸路径 /seats：代理，不要 301
location = /seats {
    proxy_pass         http://employee_seats;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Forwarded-Proto https;
}
